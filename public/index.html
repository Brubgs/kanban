<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <header class="header">
    <h1>Meu Quadro Kanban</h1>
  </header>

  <main class="kanban-container">
    <div class="column" data-column-id="todo">
      <div class="column-header">
        <h2>A Fazer</h2>
        <span class="card-count">2</span>
      </div>
      <div class="task-list">
        <div class="task-card" draggable="true" id="card-1">
          <h3>Estudar ES Modules</h3>
          <p>Revisar imports e exports no Node.js</p>
        </div>
        <div class="task-card" draggable="true" id="card-2">
          <h3>Criar rotas da API</h3>
          <p>Configurar endpoints Express</p>
        </div>
      </div>
    </div>

    <div class="column" data-column-id="in-progress">
      <div class="column-header">
        <h2>Em Progresso</h2>
        <span class="card-count">1</span>
      </div>
      <div class="task-list">
        <div class="task-card" draggable="true" id="card-3">
          <h3>Interface Kanban</h3>
          <p>Montar o HTML e CSS do frontend</p>
        </div>
      </div>
    </div>

    <div class="column" data-column-id="done">
      <div class="column-header">
        <h2>Concluído</h2>
        <span class="card-count">1</span>
      </div>
      <div class="task-list">
        <div class="task-card" draggable="true" id="card-4">
          <h3>Conexão MongoDB</h3>
          <p>Configurar Mongoose e schemas</p>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
